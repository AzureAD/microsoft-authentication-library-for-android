# File: azure-pipelines\pull-request-validation\pr-msal-instrumented.yml
# Description: PR validation that runs MSAL instrumented (androidTest) tests on an Android emulator.
#              Executes msal:connectedLocalDebugAndroidTest on a macOS agent (the emulator needs a
#              hypervisor; Microsoft-hosted Linux agents have no /dev/kvm and hang at boot).
# Wire this pipeline up as a Build Validation branch policy (PR trigger) in ADO.
name: $(date:yyyyMMdd)$(rev:.r)
trigger: none

variables:
# https://developer.android.com/studio/releases/platforms
- name: androidApiLevel
  value: 33
- name: androidTag
  value: default
- name: Codeql.Enabled
  value: false
- group: AndroidAuthClientAutomationSecrets
- group: MSIDLABVARS

resources:
  repositories:
  - repository: msal-dev
    type: github
    name: AzureAD/microsoft-authentication-library-for-android
    ref: dev
    endpoint: ANDROID_GITHUB

# Instrumented tests need an agent that can hardware-accelerate the Android emulator. Microsoft-hosted
# Linux agents (ubuntu-latest) do NOT expose /dev/kvm, so an x86_64 emulator hangs at boot. macOS
# hosted agents provide Hypervisor.framework, so the emulator boots reliably. Apple-Silicon macOS
# agents require an arm64-v8a system image (selected dynamically in the emulator step below).
pool:
  vmImage: macOS-latest

stages:
  - stage: instrumented_tests
    displayName: Instrumented Tests
    jobs:
    - job: run_instrumented_tests
      displayName: Run msal instrumented tests (LocalDebug)
      timeoutInMinutes: 120
      steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - bash: |
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
        displayName: 'Set VSTS Fields in Environment'
      # The repo's automation-cert.yml installs the pfx into a Windows cert store via
      # Import-PfxCertificate (Windows-only). Instrumented tests run on macOS and only need the
      # pfx file on disk to adb-push it, so we download the secret and write the file directly.
      - task: AzureKeyVault@2
        displayName: 'Azure Key Vault: download LabAuth cert'
        inputs:
          azureSubscription: 'AuthSdkResourceManager'
          KeyVaultName: 'msidlabs'
          SecretsFilter: 'LabAuth'
      - bash: |
          set -e
          # openssl decodes base64 portably (macOS `base64` uses -D, GNU uses -d/--decode).
          printf '%s' "$LAB_AUTH_B64" | openssl base64 -A -d > "$(Build.SourcesDirectory)/LabAuth.pfx"
          ls -l "$(Build.SourcesDirectory)/LabAuth.pfx"
        displayName: 'Write LabAuth cert to workspace'
        env:
          LAB_AUTH_B64: $(LabAuth)
      - bash: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"

          # Match the system-image ABI to the agent architecture (Apple Silicon vs Intel).
          if [[ "$(uname -m)" == "arm64" ]]; then ABI="arm64-v8a"; else ABI="x86_64"; fi
          SYSTEM_IMAGE="system-images;android-$(androidApiLevel);$(androidTag);$ABI"
          echo "##vso[build.addbuildtag]AndroidSystemImage=$SYSTEM_IMAGE"
          echo "Using system image: $SYSTEM_IMAGE (arch $(uname -m))"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "$SYSTEM_IMAGE" "platform-tools" "emulator" >/dev/null

          # boot_emulator: (re)create the AVD, cold-boot it, and wait until it is FULLY ready.
          # Returns non-zero if the emulator never reaches a usable state, so the caller can retry.
          boot_emulator() {
            echo "no" | "$AVDMANAGER" create avd -n android_emulator -k "$SYSTEM_IMAGE" --force

            echo "Starting emulator"
            # Headroom flags (-memory/-cores/-partition-size) stop cold boot and APK installs from
            # wedging; -accel on fails fast if HW acceleration is missing instead of hanging;
            # -no-snapshot-load/-save force a clean, deterministic cold boot every run.
            nohup "$ANDROID_HOME/emulator/emulator" -avd android_emulator \
              -no-window -no-audio -no-boot-anim -no-snapshot-load -no-snapshot-save \
              -gpu swiftshader_indirect -accel on -memory 3072 -cores 2 -partition-size 4096 \
              -camera-back none -camera-front none -netdelay none -netspeed full -no-metrics \
              > "$(Build.ArtifactStagingDirectory)/emulator.log" 2>&1 &

            echo "Waiting for device to connect"
            "$ADB" wait-for-device

            echo "Waiting for sys.boot_completed (timeout ~15 min)"
            booted=0
            for i in $(seq 1 180); do
              if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
                booted=1; break
              fi
              sleep 5
            done
            if [[ "$booted" != "1" ]]; then
              echo "##[warning]sys.boot_completed did not flip within timeout."
              return 1
            fi

            # sys.boot_completed fires before the system has settled. Wait for the boot animation
            # to stop and PackageManager to answer before declaring the device usable.
            echo "Waiting for boot animation to stop and PackageManager to come up"
            for i in $(seq 1 60); do
              anim="$("$ADB" shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')"
              if [[ "$anim" == "stopped" ]] && "$ADB" shell pm path android >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "##[warning]System did not fully settle within timeout."
            return 1
          }

          # Cold boots occasionally wedge; give it two attempts before failing the job.
          booted_ok=0
          for attempt in 1 2; do
            echo "===== Emulator boot attempt $attempt ====="
            if boot_emulator; then booted_ok=1; break; fi
            echo "Boot attempt $attempt failed; tearing down and retrying."
            "$ADB" emu kill >/dev/null 2>&1 || true
            "$ADB" kill-server >/dev/null 2>&1 || true
            sleep 5
            "$ADB" start-server >/dev/null 2>&1 || true
          done
          if [[ "$booted_ok" != "1" ]]; then
            echo "##[error]Emulator failed to boot after 2 attempts."
            echo "----- emulator.log (tail) -----"; tail -n 120 "$(Build.ArtifactStagingDirectory)/emulator.log" || true
            echo "----- logcat (tail) -----"; "$ADB" logcat -d 2>/dev/null | tail -n 120 || true
            exit 1
          fi

          # Stabilize the UI for tests: kill animations, dismiss the keyguard, and keep the screen
          # awake so nothing races against lock/sleep during the run.
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" shell input keyevent 82 || true
          "$ADB" shell svc power stayon true || true
          "$ADB" devices
          echo "Emulator ready"
        displayName: 'Start Android emulator'
      - bash: |
          echo "Push certificate to emulator"
          "$ANDROID_HOME/platform-tools/adb" push 'LabAuth.pfx' '/data/local/tmp/LabAuth.pfx'
        displayName: 'Push certificate to emulator'
      - bash: |
          mkdir -p $(Build.ArtifactStagingDirectory)/msal_logs
          $ANDROID_HOME/platform-tools/adb logcat -c
          $ANDROID_HOME/platform-tools/adb logcat -v threadtime > $(Build.ArtifactStagingDirectory)/msal_logs/logcat_logs.txt &
          echo $! > logcat.pid
          echo "Logcat started with PID: $(cat logcat.pid)"
        displayName: 'Start logcat collection'
      - task: Gradle@3
        displayName: Run msal instrumented tests
        inputs:
          gradleWrapperFile: 'gradlew'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.17'
          options: -Psugar=true -PlabSecret=/data/local/tmp/LabAuth.pfx
          tasks: 'msal:connectedLocalDebugAndroidTest'
          publishJUnitResults: true
          testResultsFiles: '**/TEST-*.xml'
          testRunTitle: 'msal_InstrumentedTests'
      - bash: |
          echo "Stopping logcat (PID: $(cat logcat.pid))"
          kill -9 $(cat logcat.pid) || true
        displayName: 'Stop logcat collection'
        condition: always()
      - task: PublishPipelineArtifact@1
        displayName: 'Publish logcat logs'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/msal_logs'
          artifactName: msal_logs
      - task: PublishPipelineArtifact@1
        displayName: 'Publish instrumented test HTML report'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/msal/build/reports/androidTests/connected/debug/flavors/local/'
          artifactName: InstrumentedTestReport-msal
