buildscript {
    if (file('src/live/google-services.json').exists()) {
        // Preserve the repositories and credentials of the active root build.
        repositories.addAll(rootProject.buildscript.repositories)
        dependencies {
            classpath 'com.google.gms:google-services:4.5.0'
        }
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def authenticatorCompatibility = project.findProperty('mfaSampleAuthenticatorCompatibility')?.toString() == 'true'
def policyProfile = project.findProperty('mfaSamplePolicyProfile') ?: (authenticatorCompatibility ? 'AUTHENTICATOR' : 'CONSERVATIVE')
def liveApplicationId = project.findProperty('mfaSampleApplicationId') ?: (authenticatorCompatibility ? 'com.azure.authenticator' : 'com.microsoft.identity.mfa.sample.live')
if (authenticatorCompatibility && (liveApplicationId != 'com.azure.authenticator' || policyProfile != 'AUTHENTICATOR')) {
    throw new GradleException('Authenticator compatibility requires its authorized package and policy profile.')
}
if (authenticatorCompatibility && ['MFA_SAMPLE_DEVELOPMENT_KEYSTORE', 'MFA_SAMPLE_DEVELOPMENT_STORE_PASSWORD',
        'MFA_SAMPLE_DEVELOPMENT_KEY_ALIAS', 'MFA_SAMPLE_DEVELOPMENT_KEY_PASSWORD'].any { !System.getenv(it) }) {
    throw new GradleException('Supply the authorized development signing configuration through MFA_SAMPLE_DEVELOPMENT_* environment variables. Never use production keys.')
}
def oauthConfig = file('src/live/res/raw/auth_config.json')
def redirectPath = '/unconfigured'
if (oauthConfig.exists()) {
    try {
        def config = new groovy.json.JsonSlurper().parse(oauthConfig)
        if (config.containsKey('client_secret')) {
            throw new GradleException('The deletion sample is a public client; remove client_secret before packaging.')
        }
        def redirect = new URI(config.redirect_uri as String)
        if (redirect.scheme == 'msauth' && redirect.host == liveApplicationId) {
            redirectPath = redirect.path
        }
    } catch (GradleException invalidConfiguration) {
        throw invalidConfiguration
    } catch (Exception ignored) {
        // Runtime setup diagnostics keep an unconfigured APK usable for enrollment.
    }
}
if (!(policyProfile in ['CONSERVATIVE', 'AUTHENTICATOR']) ||
        (policyProfile == 'AUTHENTICATOR' && liveApplicationId != 'com.azure.authenticator')) {
    throw new GradleException('MFA policy profile must be CONSERVATIVE, or AUTHENTICATOR with its explicitly authorized application ID.')
}

if (file('src/live/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.microsoft.identity.mfa.sample'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0-poc'
        missingDimensionStrategy 'main', 'local'
    }
    signingConfigs {
        if (authenticatorCompatibility) {
            compatibilityDevelopment {
                storeFile file(System.getenv('MFA_SAMPLE_DEVELOPMENT_KEYSTORE'))
                storePassword System.getenv('MFA_SAMPLE_DEVELOPMENT_STORE_PASSWORD')
                keyAlias System.getenv('MFA_SAMPLE_DEVELOPMENT_KEY_ALIAS')
                keyPassword System.getenv('MFA_SAMPLE_DEVELOPMENT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (authenticatorCompatibility) signingConfig = signingConfigs.compatibilityDevelopment
        }
    }
    flavorDimensions 'mode'
    productFlavors {
        live {
            dimension 'mode'
            applicationId liveApplicationId
            manifestPlaceholders = [mfaRedirectHost: liveApplicationId, mfaRedirectPath: redirectPath]
            buildConfigField 'String', 'MFA_POLICY_PROFILE', "\"$policyProfile\""
            buildConfigField 'boolean', 'MFA_AUTHENTICATOR_COMPATIBILITY', authenticatorCompatibility.toString()
            resValue 'string', 'app_name', authenticatorCompatibility ? 'MFA PoC - Authenticator compatibility' : 'MFA PoC - Live'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enable = false
    }
}

dependencies {
    implementation project(':mfa')
    implementation project(':msal')
    implementation "com.google.code.gson:gson:$rootProject.ext.gsonVersion"
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appCompatVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$rootProject.ext.lifecycleKtxVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycleKtxVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.kotlinXCoroutinesVersion"
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.kotlinXCoroutinesVersion"
    liveImplementation platform('com.google.firebase:firebase-bom:35.0.2')
    liveImplementation 'com.google.firebase:firebase-messaging'
}
