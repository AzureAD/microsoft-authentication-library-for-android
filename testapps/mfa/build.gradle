buildscript {
    if (file('src/live/google-services.json').exists()) {
        // Preserve the repositories and credentials of the active root build.
        repositories.addAll(rootProject.buildscript.repositories)
        dependencies {
            classpath 'com.google.gms:google-services:4.5.0'
        }
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def policyProfile = project.findProperty('mfaSamplePolicyProfile') ?: 'CONSERVATIVE'
def liveApplicationId = project.findProperty('mfaSampleApplicationId') ?: 'com.microsoft.identity.mfa.sample.live'
if (!(policyProfile in ['CONSERVATIVE', 'AUTHENTICATOR']) ||
        (policyProfile == 'AUTHENTICATOR' && liveApplicationId != 'com.azure.authenticator')) {
    throw new GradleException('MFA policy profile must be CONSERVATIVE, or AUTHENTICATOR with its explicitly authorized application ID.')
}

if (file('src/live/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.microsoft.identity.mfa.sample'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0-poc'
        missingDimensionStrategy 'main', 'local'
    }
    flavorDimensions 'mode'
    productFlavors {
        live {
            dimension 'mode'
            applicationId liveApplicationId
            buildConfigField 'String', 'MFA_POLICY_PROFILE', "\"$policyProfile\""
            resValue 'string', 'app_name', 'MFA PoC - Live'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enable = false
    }
}

dependencies {
    implementation project(':mfa')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appCompatVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$rootProject.ext.lifecycleKtxVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycleKtxVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.kotlinXCoroutinesVersion"
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    liveImplementation platform('com.google.firebase:firebase-bom:35.0.2')
    liveImplementation 'com.google.firebase:firebase-messaging'
}
