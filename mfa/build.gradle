plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.microsoft.identity.mfa'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        languageVersion = '1.9'
        apiVersion = '1.9'
    }

    flavorDimensions 'main'
    productFlavors {
        local { dimension 'main' }
        dist { dimension 'main' }
    }
}

// Matches the pinned Common source version; release consumers may supply their aligned version.
def commonVersion = project.findProperty('distCommonVersion') ?: '24.7.0'
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$rootProject.ext.kotlinXCoroutinesVersion"
    localImplementation project(':common')
    distImplementation "com.microsoft.identity:common:$commonVersion"

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.ext.kotlinXCoroutinesVersion"
}
