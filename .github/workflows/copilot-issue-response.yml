# GitHub Copilot Issue Response workflow
# Automatically triages and responds to issues using AI.

name: Copilot Issue Triage

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  models: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage New Issue
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'Target-For-Ai-Triage'))
    outputs:
      issue_type: ${{ steps.ai_triage.outputs.issue_type }}
      priority: ${{ steps.ai_triage.outputs.priority }}
      is_very_old: ${{ steps.ai_triage.outputs.is_very_old }}
      msal_version: ${{ steps.ai_triage.outputs.msal_version }}
      ai_solution: ${{ steps.ai_triage.outputs.ai_solution }}
      needs_info: ${{ steps.ai_triage.outputs.needs_info }}
      related_issues: ${{ steps.ai_triage.outputs.related_issues }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI-Powered-Triage
        id: ai_triage
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;

            function redactSecrets(text) {
              if (!text) return '';
              return text
                .replace(/eyJ[A-Za-z0-9_\-+\/]{10,}\.[A-Za-z0-9_\-+\/]+\.[A-Za-z0-9_\-+\/]*/g, '[REDACTED_JWT]')
                .replace(/Bearer\s+[A-Za-z0-9_\-./+=]+/gi, 'Bearer [REDACTED]')
                .replace(/(client_secret|access_token|refresh_token|api[_-]?key)["\s:=]+[^\s"',}]+/gi, '$1=[REDACTED]')
                .replace(/[A-Za-z0-9+\/]{100,}={0,2}/g, '[REDACTED_BASE64]');
            }

            const redactedTitle = redactSecrets(issue.title);
            const redactedBody = redactSecrets(issue.body || '');

            # # Load copilot instructions
            # let copilotInstructions = '';
            # try {
            #   copilotInstructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8').substring(0, 12000);
            # } catch(e) {
            #   console.error('Failed to load copilot instructions:', e.message);
            # }

            # Load common issues
            let commonIssuesGuide = '';
            try {
              commonIssuesGuide = fs.readFileSync('.github/issue-responses/common-issues-guide.md', 'utf8');
            } catch(e) {
              console.error('Failed to load common issues guide:', e.message);
            }

            // Load the latest release version
            let releases = [];
            let latestVersion = '8.+';
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestVersion = latestRelease.data.tag_name.replace(/^v/, '');
              
              // Also fetch all releases for version age checking
              releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner, repo: context.repo.repo, per_page: 100
              });
            } catch(e) {
              console.error('Failed to fetch releases:', e.message);
            }

            const systemPrompt = [
              'You are an expert MSAL Android support engineer. Analyze GitHub issues and provide classification, priority, and solutions.',
              '',
              '=== COMMON ISSUES REFERENCE ===',
              'The following guide contains solutions for 250+ issues organized by category.',
              'Use the "Error Pattern Quick Lookup" section to quickly find relevant solutions.',
              'Always cite related GitHub issues (format: #NNNN) when providing solutions.',
              '',
              commonIssuesGuide,
              '',
              '=== TRIAGE INSTRUCTIONS ===',
              'PRIORITY THRESHOLDS (Only apply if user provides device count, otherwise assign p4-Minor):',
              '- p1-High: 5000+ devices impacted',
              '- p2-Medium: 4999-1000 devices impacted',
              '- p3-Low: 100-999 devices impacted',
              '- p4-Minor: <100 devices impacted, or no device impact given',
              '',
              'ISSUE TYPE CLASSIFICATION:',
              '- Bug: Library bug, unexpected behavior when MSAL used correctly',
              '- User-Error: Incorrect MSAL Implementation causing unexpected behavior'
              '- Feature-Request: Desired behavior not currently supported',
              '- Question: User asking for clarification, no error/unexpected behavior',
              '- Other: Miscellaneous, no clear classification',
              '',
              'VERSION SUPPORT: MSAL versions older than 548 days (1.5 years) are unsupported.',
              '',
              '=== SOLUTION REQUIREMENTS ===',
              'In suggestedSolution field:',
              '1. Identify the most similar issue from the Common Issues Reference',
              '2. Provide specific solution with code examples if applicable',
              '3. List related GitHub issues from the guide (e.g., "See also: #1234, #5678")',
              '4. If issue not in guide, provide general MSAL troubleshooting steps',
              '',
              'Respond with ONLY valid JSON:',
              '{',
              '  "issueType": "Bug|Feature-Request|Question|Other|null",',
              '  "priority": "p1-High|p2-Medium|p3-Low|p4-Minor",',
              '  "priorityReason": "string explaining priority reasoning or null if impact is not found",',
              '  "deviceCount": "number or null if not found in issue title or body",',
              '  "msalVersion": "extracted MSAL version string from the issue title/body or null if not found",',
              '  "isVeryOld": "boolean (true if msalVersion is older than 548 days)",',
              '  "needsMoreInfo": "boolean, true if issue has insufficient information for triage",',
              '  "suggestedSolution": "detailed solution referencing Common Issues guide sections and related GitHub issues",',
              '  "relatedIssues": "array of related GitHub issue numbers from the guide, e.g. [1234, 5678]",',
              '  "classificationReason": "brief explanation of why issueType was chosen"',
              '}'
            ].join('\n');

            const userPrompt = [
              'Issue Title: ' + redactedTitle,
              '',
              'Issue Description:',
              redactedBody,
              '',
              'Available Releases (for version age check):',
              releases.slice(0, 60).map(r => r.tag_name + ': ' + r.published_at).join('\n'),
              '',
              'Latest MSAL Version: ' + latestVersion,
              '',
              'Analyze this issue and provide comprehensive triage in JSON format according to your system prompt. Make sure to sure MSAL AI Guidance files.'
            ].join('\n');

            let result = {
              issueType: 'null',
              priority: null,
              priorityReason: null,
              deviceCount: null,
              msalVersion: null,
              isVeryOld: false,
              needsMoreInfo: true,
              suggestedSolution: null,
              relatedIssues: [],
              classificationReason: 'AI classification'
            };

            try {
              console.log('Calling GitHub Models API for triage...');
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: 'gpt-4o',
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                  ]
                })
              });

              console.log(response)

              if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + await response.text());

              const data = await response.json();
              const content = data.choices[0].message.content;
              const jsonMatch = content.match(/\{[\s\S]*\}/);
              if (jsonMatch) {
                result = { ...result, ...JSON.parse(jsonMatch[0]) };
                console.log('AI triage result:', JSON.stringify(result));
              } else {
                console.log("There was an error with the json match");
              }
            } catch (error) {
              console.error('AI triage error:', error.message);
            }

            core.setOutput('issue_type', result.issueType);
            core.setOutput('priority', result.priority || '');
            core.setOutput('priority_reason', result.priorityReason || '');
            core.setOutput('msal_version', result.msalVersion || '');
            core.setOutput('is_very_old', result.isVeryOld.toString());
            core.setOutput('needs_info', result.needsMoreInfo.toString());
            core.setOutput('classification_reason', result.classificationReason || '');
            core.setOutput('ai_solution', result.suggestedSolution || '');
            core.setOutput('related_issues', JSON.stringify(result.relatedIssues || []));

      - name: Apply Labels
        uses: actions/github-script@v7
        env:
          ISSUE_TYPE: ${{ steps.ai_triage.outputs.issue_type }}
          PRIORITY: ${{ steps.ai_triage.outputs.priority }}
          IS_VERY_OLD: ${{ steps.ai_triage.outputs.is_very_old }}
          NEEDS_INFO: ${{ steps.ai_triage.outputs.needs_info }}
        with:
          script: |
            const labels = [process.env.ISSUE_TYPE];
            if (process.env.PRIORITY) labels.push(process.env.PRIORITY);
            if (process.env.IS_VERY_OLD === 'true') labels.push('very-old-msal');
            if (process.env.NEEDS_INFO === 'true') labels.push('needs-more-info');

            const labelColors = {
              'Bug': 'd93f0b',
              'User-Error': 'b0e9e0",
              'Feature-Request': 'd7f79b',
              'Question': '1d76db',
              'Other': '93a588',
              'very-old-msal': 'ffa500',
              'p0-CodeRed': 'b60205',
              'p1-High': 'd93f0b',
              'p2-Medium': 'fbca04',
              'p3-Low': 'fef2c0',
              'p4-Minor': 'c5def5'
            };

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: labelColors[label] || '666666'
                  });
                } catch(e) {
                  console.log('Could not create label ' + label);
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

            // Remove the trigger label if it was used
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'Target-For-Ai-Triage'
              });
            } catch(e) {
              // Label wasn't present, ignore
            }

  respond:
    name: Generate Response
    needs: triage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Post Response
        uses: actions/github-script@v7
        env:
          ISSUE_TYPE: ${{ needs.triage.outputs.issue_type }}
          PRIORITY: ${{ needs.triage.outputs.priority }}
          IS_VERY_OLD: ${{ needs.triage.outputs.is_very_old }}
          MSAL_VERSION: ${{ needs.triage.outputs.msal_version }}
          NEEDS_INFO: ${{ needs.triage.outputs.needs_info }}
          AI_SOLUTION: ${{ needs.triage.outputs.ai_solution }}
          RELATED_ISSUES: ${{ needs.triage.outputs.related_issues }}
        with:
          script: |
            const issueType = process.env.ISSUE_TYPE;
            const priority = process.env.PRIORITY;
            const isVeryOld = process.env.IS_VERY_OLD === 'true';
            const msalVersion = process.env.MSAL_VERSION;
            const needsInfo = process.env.NEEDS_INFO === 'true';
            const aiSolution = process.env.AI_SOLUTION;
            const relatedIssues = JSON.parse(process.env.RELATED_ISSUES || '[]');

            let latestVersion = '8.+';
            try {
              const rel = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestVersion = rel.data.tag_name.replace(/^v/, '');
            } catch(e) {}

            let response = 'Thank you for opening this issue!\n\n';

            if (isVeryOld) {
              response += '⚠️ **Unsupported MSAL Version Detected**\n\n';
              response += 'Version **' + msalVersion + '** is more than 1.5 years old and is no longer supported.\n\n';
              response += '**Please upgrade to the latest version (' + latestVersion + '):**\n';
              response += '```gradle\nimplementation "com.microsoft.identity.client:msal:8.+"\n```\n\n';
              response += 'If the issue persists after upgrading, please reopen with updated details.\n\n';
              response += '---\n*Automated response. A team member will review if needed.*';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: response
              });
              return;
            }

            response += '**Labels Applied:** `' + issueType + '`';
            if (priority) response += ', `' + priority + '`';
            if (needsInfo) response += ', `needs-more-info`';
            response += '\n\n';

            if (aiSolution) {
              response += '## 🤖 AI Analysis\n\n' + aiSolution + '\n\n';
              
              if (relatedIssues && relatedIssues.length > 0) {
                response += '**Related Issues:** ';
                response += relatedIssues.map(num => '#' + num).join(', ');
                response += '\n\n';
              }
              
              response += '---\n\n';
            }

            if (needsInfo) {
              response += '**To help us assist you, please provide:**\n';
              response += '- MSAL version (latest: ' + latestVersion + ')\n';
              response += '- Android version and device\n';
              response += '- Complete error message/stack trace\n';
              response += '- Steps to reproduce\n\n';
            }

            if (!priority && (issueType === 'bug' || issueType === 'needs-investigation')) {
              response += '### 📊 Help Us Prioritize\n\n';
              response += 'Comment with customer impact:\n```\nPING-COPILOT: We have <number> devices/users affected\n```\n\n';
            }

            response += '---\n\n**Need help?** Comment with:\n```\nPING-COPILOT: <your question>\n```\n\n';
            response += '> **Privacy:** Do not include credentials, tokens, or PII in PING-COPILOT requests.\n\n';
            response += '*Automated response. A team member will review soon.*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: response
            });

  handle_ping_copilot:
    name: Handle PING-COPILOT
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      (contains(github.event.comment.body, 'PING-COPILOT:') || contains(github.event.comment.body, 'ping-copilot:'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process PING-COPILOT Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = context.payload.comment.body;
            const issue = context.payload.issue;

            const match = comment.match(/PING-COPILOT:\s*([\s\S]+)/i);
            if (!match) return;
            const userRequest = match[1].trim();

            function redactSecrets(text) {
              if (!text) return '';
              return text
                .replace(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/g, '[REDACTED_JWT]')
                .replace(/Bearer\s+[A-Za-z0-9_\-.]+/gi, 'Bearer [REDACTED]')
                .replace(/(client_secret|access_token|api[_-]?key)["\s:=]+[^\s"',}]+/gi, '$1=[REDACTED]')
                .replace(/[A-Za-z0-9+\/]{50,}={0,2}/g, '[REDACTED_BASE64]');
            }

            let copilotInstructions = '', commonIssuesGuide = '';
            try { copilotInstructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8').substring(0, 12000); } catch(e) {}
            try { commonIssuesGuide = fs.readFileSync('.github/issue-responses/common-issues-guide.md', 'utf8').substring(0, 12000); } catch(e) {}

            let latestVersion = '8.+';
            try {
              const rel = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestVersion = rel.data.tag_name.replace(/^v/, '');
            } catch(e) {}

            const systemPrompt = [
              'You are an expert MSAL Android support engineer.',
              '',
              'MSAL Expertise:',
              copilotInstructions.substring(0, 8000),
              '',
              'Common Issues:',
              commonIssuesGuide.substring(0, 8000),
              '',
              'PRIORITY THRESHOLDS:',
              '- p0-CodeRed: 10000+ devices',
              '- p1-High: 1000-9999 devices',
              '- p2-Medium: 300-999 devices',
              '- p3-Low: 100-299 devices',
              '- p4-Minor: <100 devices',
              '',
              'IMPORTANT: Never echo secrets, tokens, or PII in your response.',
              '',
              'If the user provides device/user count, also output a JSON block at the END:',
              '{"detectedPriority": "p0-CodeRed|p1-High|p2-Medium|p3-Low|p4-Minor|null", "deviceCount": number|null}'
            ].join('\n');

            const userPrompt = [
              'Issue: ' + redactSecrets(issue.title),
              'Description: ' + redactSecrets(issue.body || '').substring(0, 2000),
              '',
              'User Request: ' + redactSecrets(userRequest),
              '',
              'Latest MSAL: ' + latestVersion,
              '',
              'Provide a helpful response. If device count is mentioned, include priority JSON at the end.'
            ].join('\n');

            let aiResponse = '';
            let detectedPriority = null;

            try {
              const response = await fetch('https://models.github.ai/inference/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model: 'gpt-4o',
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                  ]
                })
              });

              if (!response.ok) throw new Error('HTTP ' + response.status);

              const data = await response.json();
              aiResponse = data.choices[0].message.content;

              const priorityMatch = aiResponse.match(/\{"detectedPriority":\s*"([^"]+)"[^}]*\}/);
              if (priorityMatch) {
                const parsed = JSON.parse(priorityMatch[0]);
                if (parsed.detectedPriority && parsed.detectedPriority !== 'null') {
                  detectedPriority = parsed.detectedPriority;
                }
                aiResponse = aiResponse.replace(/\{"detectedPriority"[^}]*\}/, '').trim();
              }
            } catch (error) {
              console.error('AI error:', error.message);
              aiResponse = 'I will help with: "' + userRequest + '"\n\nPlease review:\n- [MSAL Documentation](https://github.com/AzureAD/microsoft-authentication-library-for-android)\n- [Common Issues Guide](.github/issue-responses/common-issues-guide.md)';
            }

            if (detectedPriority) {
              const labelColors = {
                'p0-CodeRed': 'b60205',
                'p1-High': 'd93f0b',
                'p2-Medium': 'fbca04',
                'p3-Low': 'fef2c0',
                'p4-Minor': 'c5def5'
              };

              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: detectedPriority
                });
              } catch {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: detectedPriority,
                    color: labelColors[detectedPriority] || 'fbca04'
                  });
                } catch(e) {}
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [detectedPriority]
              });
            }

            let finalResponse = '';
            if (detectedPriority) {
              finalResponse += '📊 **Priority Updated:** Applied `' + detectedPriority + '` based on customer impact.\n\n---\n\n';
            }
            finalResponse += aiResponse;
            finalResponse += '\n\n---\n\n**Need more help?** Comment with:\n```\nPING-COPILOT: <your question>\n```\n\n';
            finalResponse += '> **Privacy:** Do not include credentials, tokens, or PII.\n\n';
            finalResponse += '*AI-powered response. A team member will review.*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: finalResponse
            });
