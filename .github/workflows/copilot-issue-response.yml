# GitHub Copilot Issue Response Workflow
#
# This workflow uses GitHub Copilot to automatically triage and respond to new issues.
# It analyzes the issue content and provides helpful initial responses based on common patterns.
#
# Prerequisites:
# - Copilot must be enabled for the repository
# - The workflow requires write access to issues
#
# Note: This is a template for integration with GitHub Copilot. Manual review of responses
# is recommended before enabling automatic posting in production.

name: Copilot Issue Triage

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

# Prevent multiple simultaneous runs for the same issue
concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Initial triage and labeling
  triage:
    name: Triage New Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    outputs:
      issue_type: ${{ steps.classify.outputs.type }}
      needs_info: ${{ steps.classify.outputs.needs_info }}
      msal_version: ${{ steps.classify.outputs.msal_version }}
      version_age_days: ${{ steps.classify.outputs.version_age_days }}
      is_very_old: ${{ steps.classify.outputs.is_very_old }}
      version_release_date: ${{ steps.classify.outputs.version_release_date }}
      classification_reasons: ${{ steps.classify.outputs.classification_reasons }}
      detected_patterns: ${{ steps.classify.outputs.detected_patterns }}
      ai_solution: ${{ steps.classify.outputs.ai_solution }}
      ai_confidence: ${{ steps.classify.outputs.ai_confidence }}
      has_initial_impact: ${{ steps.detect_initial_impact.outputs.has_impact }}
      initial_priority: ${{ steps.detect_initial_impact.outputs.priority_level }}
      initial_impact_reason: ${{ steps.detect_initial_impact.outputs.impact_reason }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Classify Issue
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const content = title + ' ' + body;
            
            // Classify issue type (priority will NOT be auto-assigned)
            let issueType = 'question';
            let needsInfo = true;
            
            // Version detection - extract MSAL version
            let msalVersion = null;
            let versionAgeDays = null;
            let isVeryOld = false;
            let versionReleaseDate = null;
            
            // Try multiple patterns: v8.1.1, msal:8.1.1, version 8.1.1 (no fallback to avoid false positives)
            const versionPatterns = [
              /v(\d+\.\d+\.\d+)/i,
              /msal[:\s]+(\d+\.\d+\.\d+)/i,
              /version[:\s]+(\d+\.\d+\.\d+)/i
            ];
            
            for (const pattern of versionPatterns) {
              const match = content.match(pattern);
              if (match && match[1]) {
                msalVersion = match[1];
                console.log(`Found MSAL version: ${msalVersion}`);
                break;
              }
            }
            
            // If version found, check its age
            if (msalVersion) {
              try {
                // Fetch all releases using pagination to avoid 100-item limit
                const releases = await github.paginate(
                  github.rest.repos.listReleases,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 100
                  }
                );
                
                // Find the matching release
                const matchingRelease = releases.find(r => 
                  r.tag_name === `v${msalVersion}` || r.tag_name === msalVersion
                );
                
                if (matchingRelease) {
                  const releaseDate = new Date(matchingRelease.published_at);
                  const now = new Date();
                  versionAgeDays = Math.floor((now - releaseDate) / (1000 * 60 * 60 * 24));
                  versionReleaseDate = releaseDate.toISOString().split('T')[0];
                  
                  // Check if version is older than 1.5 years (548 days)
                  isVeryOld = versionAgeDays > 548;
                  
                  console.log(`Version ${msalVersion} released on ${versionReleaseDate}, age: ${versionAgeDays} days, is_very_old: ${isVeryOld}`);
                }
              } catch (error) {
                console.error(`Error checking version age: ${error.message}`);
              }
            }
            
            // AI-Powered Classification
            let aiClassification = null;
            let aiSolution = null;
            let aiConfidence = 'low';
            
            try {
              console.log('Attempting AI classification...');
              
              // Fetch guidance files for AI context
              const fs = require('fs');
              const copilotInstructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8').substring(0, 15000);
              const commonIssuesGuide = fs.readFileSync('.github/issue-responses/common-issues-guide.md', 'utf8').substring(0, 15000);
              
              // Redact secrets from issue content before sending to AI
              function redactSecrets(text) {
                return text
                  .replace(/eyJ[A-Za-z0-9_-]{10,}/g, '[REDACTED_JWT]')
                  .replace(/Bearer\s+[A-Za-z0-9_\-.]+/gi, 'Bearer [REDACTED_TOKEN]')
                  .replace(/Authorization:\s*[^\s]+/gi, 'Authorization: [REDACTED]')
                  .replace(/(client_secret|access_token|api[_-]?key)["\s:=]+[^\s"',}]+/gi, '$1: [REDACTED]')
                  .replace(/[A-Za-z0-9+\/]{40,}={0,2}/g, (match) => match.length > 40 ? '[REDACTED_BASE64]' : match);
              }
              
              const redactedTitle = redactSecrets(issue.title);
              const redactedBody = redactSecrets(issue.body || '');
              
              // Construct AI prompt (using string concatenation to avoid YAML issues)
              const systemPrompt = 'You are an expert MSAL Android library support engineer. Analyze GitHub issues and provide accurate classification and solutions.\n\n' +
                'Your Expertise:\n' + copilotInstructions.substring(0, 8000) + '\n\n' +
                'Common Issues Reference:\n' + commonIssuesGuide.substring(0, 6000) + '\n\n' +
                'Task:\n' +
                '1. Classify the issue type: "bug", "question", "feature-request", or "security"\n' +
                '2. Determine if it is a security issue (high accuracy required)\n' +
                '3. Assess if more information is needed (version, error message, steps to reproduce)\n' +
                '4. Provide a concise 2-3 sentence solution suggestion\n\n' +
                'Output JSON format:\n' +
                '{\n' +
                '  "issueType": "bug|question|feature-request|security",\n' +
                '  "isSecurity": boolean,\n' +
                '  "needsMoreInfo": boolean,\n' +
                '  "suggestedSolution": "string (2-3 sentences with specific guidance)",\n' +
                '  "confidence": "high|medium|low"\n' +
                '}\n\n' +
                'Never echo secrets, tokens, or PII in your response.';

              const userPrompt = 'Issue Title: ' + redactedTitle + '\n\n' +
                'Issue Description:\n' + redactedBody.substring(0, 3000) + '\n\n' +
                (msalVersion ? ('MSAL Version: ' + msalVersion) : 'MSAL Version: Not detected') + '\n\n' +
                'Analyze this issue and provide classification with solution suggestion in JSON format.';

              // Call GitHub Models API
              const aiResponse = await github.request('POST /models/chat/completions', {
                model: 'gpt-4o-mini',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                temperature: 0.3,
                max_tokens: 500
              });

              const aiResult = aiResponse.data.choices[0].message.content;
              console.log(`AI response: ${aiResult}`);
              
              // Parse JSON response
              const jsonMatch = aiResult.match(/\{[\s\S]*\}/);
              if (jsonMatch) {
                aiClassification = JSON.parse(jsonMatch[0]);
                aiSolution = aiClassification.suggestedSolution || null;
                aiConfidence = aiClassification.confidence || 'medium';
                console.log(`AI Classification: ${aiClassification.issueType}, Security: ${aiClassification.isSecurity}, Solution provided: ${!!aiSolution}`);
              }
            } catch (error) {
              console.log(`AI classification failed: ${error.message}. Falling back to rule-based classification.`);
            }
            
            // Classification logic - Use AI classification if available, otherwise fall back to rule-based
            let classificationReasons = [];
            
            if (aiClassification && aiConfidence !== 'low') {
              // Use AI classification
              issueType = aiClassification.issueType || 'question';
              needsInfo = aiClassification.needsMoreInfo !== false; // Default to true if not specified
              
              classificationReasons.push(`AI Classification (${aiConfidence} confidence): ${issueType}`);
              if (aiClassification.isSecurity) {
                issueType = 'security';
                classificationReasons.push(`AI detected security-related issue`);
              }
              classificationReasons.push(`AI analysis complete - using AI classification`);
            } else {
              // Fallback to rule-based classification
              classificationReasons.push(`Using rule-based classification (AI unavailable or low confidence)`);
              
              // Security indicators - requires immediate attention
              const securityKeywords = ['security', 'vulnerability', 'cve', 'exploit', 'attack'];
              const securityMatches = securityKeywords.filter(kw => content.includes(kw));
              if (securityMatches.length > 0) {
                issueType = 'security';
                classificationReasons.push(`Security-related keywords detected: ${securityMatches.join(', ')}`);
              }
              
              // Feature request indicators - check for explicit feature requests
              const featureKeywords = ['feature request', 'enhancement', 'add support', 'would be nice', 'suggestion', 'could you add'];
              const featureMatches = featureKeywords.filter(kw => content.includes(kw));
              if (featureMatches.length > 0 && issueType !== 'security') {
                issueType = 'feature-request';
                classificationReasons.push(`Feature request indicators found: ${featureMatches.join(', ')}`);
              }
              
              // Potential issue indicators - but could be user error or configuration issue
              // Be conservative: presence of technical terms doesn't automatically mean it's a bug in our code
              const technicalErrorKeywords = [
                'crash', 'exception', 'nullpointerexception', 'illegalstateexception',
                'stacktrace', 'stack trace', 'throws'
              ];
              const technicalErrorMatches = technicalErrorKeywords.filter(kw => content.includes(kw));
              
              const behaviorKeywords = [
                'fails to', 'broken', 'does not work', 'not working', 'stopped working', 'doesn\'t work',
                'unexpected behavior', 'unexpected', 'incorrect', 'wrong',
                'mismatch', 'fallback', 'not recognized', 'not launch'
              ];
              const behaviorMatches = behaviorKeywords.filter(kw => content.includes(kw));
              
              // Check for explicit bug label in title/body
              const explicitBug = title.includes('[bug]') || body.includes('**bug**');
              
              if (issueType !== 'security' && issueType !== 'feature-request') {
                if (technicalErrorMatches.length > 0 || behaviorMatches.length > 0 || explicitBug) {
                  // Use "needs-investigation" instead of "bug" to indicate this requires review
                  // Stack traces and errors don't automatically mean there's a bug in our code
                  issueType = 'needs-investigation';
                  if (technicalErrorMatches.length > 0) {
                    classificationReasons.push(`Technical error indicators detected: ${technicalErrorMatches.join(', ')}`);
                    classificationReasons.push(`Note: Stack traces may indicate user error or configuration issues, not necessarily bugs in MSAL`);
                  }
                  if (behaviorMatches.length > 0) {
                    classificationReasons.push(`Behavior issue indicators detected: ${behaviorMatches.join(', ')}`);
                  }
                  if (explicitBug) {
                    classificationReasons.push(`Issue explicitly labeled as a bug by reporter`);
                  }
                }
                // Don't classify as bug just because it contains generic words like "error" or "issue"
              }
            }
            
            // Store classification reasons for verbose explanation
            core.setOutput('classification_reasons', JSON.stringify(classificationReasons));
            
            // Pattern Detection - detect common issue patterns for targeted guidance
            let detectedPatterns = [];
            
            // Redirect URI issues
            if (content.includes('redirect') && (content.includes('mismatch') || content.includes('invalid'))) {
              detectedPatterns.push({
                name: 'redirect_uri',
                title: 'Redirect URI Configuration',
                message: `This might be a redirect URI encoding issue. Remember:\n` +
                         `- \`auth_config.json\`: signature hash in redirect_uri must be **URL encoded**\n` +
                         `- \`AndroidManifest.xml\`: signature hash must be **NOT URL encoded**\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md) for details.`
              });
            }
            
            // AADSTS errors
            const aadstsMatch = content.match(/aadsts\d{5,6}/i);
            if (aadstsMatch) {
              const errorCode = aadstsMatch[0].toUpperCase();
              detectedPatterns.push({
                name: 'aadsts_error',
                title: `${errorCode} Error Detected`,
                message: `I noticed you're encountering an ${errorCode} error. ` +
                         `Check our [Common Issues Guide](.github/issue-responses/common-issues-guide.md) for AADSTS error codes and solutions.`
              });
            }
            
            // Broker issues
            if (content.includes('broker') || content.includes('authenticator') || content.includes('company portal') || 
                content.includes('signature hash not match') || content.includes('not recognized as')) {
              detectedPatterns.push({
                name: 'broker',
                title: 'Broker Integration',
                message: `For broker-related issues, ensure:\n` +
                         `- \`broker_redirect_uri_registered: true\` in auth_config.json\n` +
                         `- Microsoft Authenticator or Company Portal is installed\n` +
                         `- Your signature hash matches Azure App Registration\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md) for broker integration details.`
              });
            }
            
            // Deprecated API usage
            if (content.includes('acquiretoken(activity') || content.includes('acquiretokensilentasync')) {
              detectedPatterns.push({
                name: 'deprecated_api',
                title: 'Deprecated API Usage',
                message: `It looks like you might be using deprecated MSAL APIs. ` +
                         `Please use the Parameters-based APIs instead:\n\n` +
                         `\`\`\`java\n` +
                         `// Use this instead\n` +
                         `AcquireTokenParameters params = new AcquireTokenParameters.Builder()\n` +
                         `    .withScopes(SCOPES)\n` +
                         `    .withCallback(callback)\n` +
                         `    .build();\n` +
                         `mPCA.acquireToken(params);\n` +
                         `\`\`\`\n\n` +
                         `See our [Code Snippets](snippets/) for more examples.`
              });
            }
            
            // PCA initialization issues
            if (content.includes('null') && (content.includes('pca') || content.includes('publicclientapplication'))) {
              detectedPatterns.push({
                name: 'pca_init',
                title: 'PCA Initialization',
                message: `This might be related to PublicClientApplication initialization. ` +
                         `Make sure to:\n` +
                         `1. Initialize PCA asynchronously before use\n` +
                         `2. Check for null before calling MSAL methods\n` +
                         `3. Handle initialization errors\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md) for initialization patterns.`
              });
            }
            
            // Silent token issues
            if ((content.includes('acquiretokensilent') || content.includes('silent token')) && 
                (content.includes('fail') || content.includes('no cached accounts'))) {
              detectedPatterns.push({
                name: 'silent_token',
                title: 'Silent Token Acquisition',
                message: `Silent token acquisition failures are common when:\n` +
                         `- No cached token is available\n` +
                         `- Refresh token has expired\n` +
                         `- User consent is required for new scopes\n\n` +
                         `Always implement fallback to interactive authentication:\n` +
                         `\`\`\`java\n` +
                         `if (exception instanceof MsalUiRequiredException) {\n` +
                         `    // Fall back to interactive\n` +
                         `    acquireTokenInteractively();\n` +
                         `}\n` +
                         `\`\`\`\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md#8-silent-token-refresh-issues) for more patterns.`
              });
            }
            
            // R8/ProGuard issues
            if (content.includes('r8') || content.includes('proguard') || content.includes('minify') || 
                content.includes('missing class') || content.includes('dontwarn')) {
              detectedPatterns.push({
                name: 'r8_proguard',
                title: 'R8/ProGuard Configuration',
                message: `This looks like a code shrinking/obfuscation issue. ` +
                         `Add these rules to your \`proguard-rules.pro\`:\n\n` +
                         `\`\`\`proguard\n` +
                         `-keep class com.microsoft.identity.** { *; }\n` +
                         `-keep class com.nimbusds.** { *; }\n` +
                         `-dontwarn edu.umd.cs.findbugs.annotations.**\n` +
                         `-dontwarn com.google.crypto.tink.**\n` +
                         `-dontwarn net.jcip.annotations.**\n` +
                         `\`\`\`\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md#53-proguardr8-issues) for complete R8 configuration.`
              });
            }
            
            // B2C issues
            if (content.includes('b2c') && (content.includes('expired') || content.includes('aadb2c90080'))) {
              detectedPatterns.push({
                name: 'b2c_expired',
                title: 'Expired Grant / AADB2C90080',
                message: `This error indicates the refresh token has expired. ` +
                         `To handle this:\n` +
                         `1. Remove the account from cache before re-authenticating\n` +
                         `2. Fall back to interactive authentication\n` +
                         `3. Consider adjusting token lifetime settings in Azure B2C\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md#82-aadb2c90080---expired-grant-error) for details.`
              });
            }
            
            // JSON parsing errors (like in issue #2423)
            if (content.includes('jsonsyntaxexception') || content.includes('expected begin_object') || 
                (content.includes('json') && content.includes('parse'))) {
              detectedPatterns.push({
                name: 'json_cache',
                title: 'Token Cache Corruption',
                message: `This appears to be a token cache corruption issue. ` +
                         `MSAL should handle corrupted cache gracefully. Possible causes:\n` +
                         `- App killed during token save operation\n` +
                         `- Concurrent access to MSAL cache\n` +
                         `- Storage corruption\n\n` +
                         `**Recommended Actions:**\n` +
                         `1. Implement proper error handling for cache operations\n` +
                         `2. Fall back to interactive authentication when cache is corrupted\n` +
                         `3. Consider clearing cache on this specific error\n\n` +
                         `This may indicate a bug in MSAL's cache recovery logic that should be investigated.`
              });
            }
            
            // Browser/WebView fallback issues (like in issue #2437)
            if ((content.includes('edge') || content.includes('browser')) && 
                (content.includes('not launch') || content.includes('fallback') || 
                 content.includes('webview') || content.includes('not recognized'))) {
              detectedPatterns.push({
                name: 'browser_signature',
                title: 'Browser Signature Mismatch',
                message: `MSAL maintains a list of trusted browser signatures for security. ` +
                         `The error suggests the browser signature doesn't match MSAL's trusted list.\n\n` +
                         `**Possible Causes:**\n` +
                         `- Browser app updated with new signature\n` +
                         `- MSAL's trusted signature list is outdated\n` +
                         `- Debug vs. Release build signature differences\n\n` +
                         `**Workarounds:**\n` +
                         `1. Try using Chrome or Firefox as a workaround\n` +
                         `2. Update to the latest MSAL version (may have updated signatures)\n` +
                         `3. Update the browser app to the latest version\n\n` +
                         `This may indicate MSAL needs to update its trusted browser signatures.`
              });
            }
            
            // display-mask dependency issue
            if (content.includes('display-mask') || (content.includes('failed to resolve') && content.includes('microsoft.device'))) {
              detectedPatterns.push({
                name: 'display_mask',
                title: 'display-mask Dependency',
                message: `The \`display-mask\` library requires a specific Maven repository. ` +
                         `Add this to your \`settings.gradle\`:\n\n` +
                         `\`\`\`gradle\n` +
                         `maven {\n` +
                         `    url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'\n` +
                         `}\n` +
                         `\`\`\`\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md#54-display-mask-dependency-resolution) for details.`
              });
            }
            
            // Android 15 / SDK 35 issues
            if (content.includes('android 15') || content.includes('sdk 35') || content.includes('api 35') ||
                (content.includes('edge') && content.includes('display'))) {
              detectedPatterns.push({
                name: 'android_15',
                title: 'Android 15 Compatibility',
                message: `Android 15 (SDK 35) introduces new behaviors that may affect MSAL:\n` +
                         `- Edge-to-edge display is enabled by default\n` +
                         `- Package visibility restrictions are stricter\n\n` +
                         `Make sure to:\n` +
                         `1. Update to the latest MSAL version\n` +
                         `2. Update Microsoft Authenticator to the latest version\n` +
                         `3. Handle system bar insets properly in your theme\n\n` +
                         `See our [Common Issues Guide](.github/issue-responses/common-issues-guide.md#63-android-15-edge-to-edge-display-issues) for details.`
              });
            }
            
            // B2C specific issues (general configuration)
            if (content.includes('b2c') && (content.includes('error') || content.includes('fail') || content.includes('not working'))) {
              detectedPatterns.push({
                name: 'b2c_config',
                title: 'Azure AD B2C Configuration',
                message: `For B2C integrations, ensure:\n` +
                         `1. Authority URL follows the format: \`https://{tenant}.b2clogin.com/{tenant}.onmicrosoft.com/{policy}\`\n` +
                         `2. Your policy name is included in the authority\n` +
                         `3. You're using the correct account for the policy when calling acquireTokenSilent\n\n` +
                         `Example authority configuration:\n` +
                         `\`\`\`json\n` +
                         `"authorities": [{\n` +
                         `    "type": "B2C",\n` +
                         `    "authority_url": "https://contoso.b2clogin.com/contoso.onmicrosoft.com/B2C_1_signin"\n` +
                         `}]\n` +
                         `\`\`\``
              });
            }
            
            core.setOutput('detected_patterns', JSON.stringify(detectedPatterns));
            
            // Check if required info is present
            const hasVersion = /msal.*\d+\.\d+/.test(content) || /version.*\d+\.\d+/.test(content);
            const hasError = content.includes('error') || content.includes('exception') || content.includes('stacktrace');
            const hasSteps = content.includes('steps') || content.includes('reproduce') || content.includes('1.') || content.includes('step 1');
            
            if (hasVersion && (hasError || issueType !== 'needs-investigation')) {
              needsInfo = false;
            }
            
            core.setOutput('type', issueType);
            core.setOutput('needs_info', needsInfo);
            core.setOutput('msal_version', msalVersion || '');
            core.setOutput('version_age_days', versionAgeDays !== null ? versionAgeDays.toString() : '');
            core.setOutput('is_very_old', isVeryOld.toString());
            core.setOutput('version_release_date', versionReleaseDate || '');
            core.setOutput('ai_solution', aiSolution || '');
            core.setOutput('ai_confidence', aiConfidence);
            
            console.log(`Issue classified as: ${issueType}, Needs info: ${needsInfo}, Version: ${msalVersion || 'not detected'}, AI Solution: ${!!aiSolution}`);

      - name: Detect Impact in Initial Issue
        id: detect_initial_impact
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueBody = issue.body || '';
            
            let priorityLevel = null;
            let impactReason = '';
            let deviceCount = null;
            
            try {
              // Use AI to extract device count from initial issue body
              const impactPrompt = "Analyze the following issue description and extract customer impact information. " +
                "Focus on finding the NUMBER of devices or users affected. " +
                "Respond with ONLY a JSON object in this format: " +
                '{"deviceCount": <number or null>, "hasExplicitPriority": <boolean>, "explicitPriority": "<p0|p1|null>"}. ' +
                "Examples:\n" +
                '- "We have 500 devices affected" → {"deviceCount": 500, "hasExplicitPriority": false, "explicitPriority": null}\n' +
                '- "This is a p0 issue" → {"deviceCount": null, "hasExplicitPriority": true, "explicitPriority": "p0"}\n' +
                '- "Error occurs on Android 14 device" → {"deviceCount": null, "hasExplicitPriority": false, "explicitPriority": null}\n' +
                "Issue description to analyze: " + issueBody;
              
              const response = await github.request('POST /models/chat/completions', {
                model: 'gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a data extraction assistant. Extract impact information and respond with only valid JSON. No explanations, just JSON.'
                  },
                  {
                    role: 'user',
                    content: impactPrompt
                  }
                ],
                temperature: 0.1,
                max_tokens: 200
              });
              
              const aiResult = response.data.choices[0].message.content.trim();
              console.log('AI impact detection result:', aiResult);
              
              // Parse AI response
              const extracted = JSON.parse(aiResult);
              deviceCount = extracted.deviceCount;
              
              // Apply priority based on device count (primary method)
              if (deviceCount !== null && deviceCount > 0) {
                if (deviceCount >= 10000) {
                  priorityLevel = 'p0-CodeRed';
                  impactReason = `${deviceCount} devices/users affected`;
                } else if (deviceCount >= 1000) {
                  priorityLevel = 'p1-High';
                  impactReason = `${deviceCount} devices/users affected`;
                } else if (deviceCount >= 300) {
                  priorityLevel = 'p2-Medium';
                  impactReason = `${deviceCount} devices/users affected`;
                } else if (deviceCount >= 100) {
                  priorityLevel = 'p3-Low';
                  impactReason = `${deviceCount} devices/users affected`;
                } else {
                  priorityLevel = 'p4-Minor';
                  impactReason = `${deviceCount} devices/users affected`;
                }
              }
              
              // Check for explicit priority mentions
              if (extracted.hasExplicitPriority && extracted.explicitPriority) {
                const explicitPri = extracted.explicitPriority.toLowerCase();
                if (explicitPri === 'p0' || explicitPri === 'codered') {
                  priorityLevel = 'p0-CodeRed';
                  if (!impactReason) impactReason = 'Customer explicitly requested priority p0/CodeRed';
                } else if (explicitPri === 'p1') {
                  if (!priorityLevel || priorityLevel === 'p2-Medium' || priorityLevel === 'p3-Low' || priorityLevel === 'p4-Minor') {
                    priorityLevel = 'p1-High';
                    if (!impactReason) impactReason = 'Customer explicitly requested priority p1/High';
                  }
                }
              }
              
            } catch (error) {
              console.log('AI impact detection failed, using fallback regex:', error.message);
              
              // Fallback to simple regex if AI fails
              const deviceMatch = issueBody.match(/(\d+)\s*(device|user|customer|install|affected|impacted)/i);
              if (deviceMatch) {
                const count = parseInt(deviceMatch[1], 10);
                deviceCount = count;
                
                if (count >= 10000) {
                  priorityLevel = 'p0-CodeRed';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count >= 1000) {
                  priorityLevel = 'p1-High';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count >= 300) {
                  priorityLevel = 'p2-Medium';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count >= 100) {
                  priorityLevel = 'p3-Low';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count > 0) {
                  priorityLevel = 'p4-Minor';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                }
              }
              
              // Check for explicit priority in fallback
              const bodyLower = issueBody.toLowerCase();
              if (bodyLower.includes('p0') || bodyLower.includes('codered')) {
                priorityLevel = 'p0-CodeRed';
                if (!impactReason) impactReason = 'Customer explicitly requested priority p0/CodeRed';
              }
              
              if (!priorityLevel && (bodyLower.includes('p1') || bodyLower.includes('high priority'))) {
                priorityLevel = 'p1-High';
                if (!impactReason) impactReason = 'High priority issue reported';
              }
            }
            
            core.setOutput('has_impact', priorityLevel ? 'true' : 'false');
            core.setOutput('priority_level', priorityLevel || '');
            core.setOutput('impact_reason', impactReason);
            
            if (priorityLevel) {
              console.log(`Customer impact detected in initial issue: ${priorityLevel} - ${impactReason}`);
            }

      - name: Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueType = '${{ steps.classify.outputs.type }}';
            const needsInfo = '${{ steps.classify.outputs.needs_info }}' === 'true';
            const isVeryOld = '${{ steps.classify.outputs.is_very_old }}' === 'true';
            const hasImpact = '${{ steps.detect_initial_impact.outputs.has_impact }}' === 'true';
            const priorityLevel = '${{ steps.detect_initial_impact.outputs.priority_level }}';
            
            // Apply issue type labels and priority if detected
            const labels = [issueType];
            
            // Add priority label if customer impact was detected in initial issue
            if (hasImpact && priorityLevel) {
              labels.push(priorityLevel);
            }
            
            if (needsInfo) {
              labels.push('needs-more-info');
            }
            
            // Add very-old-msal label if version is too old
            if (isVeryOld) {
              labels.push('very-old-msal');
            }
            
            // Check which labels exist and create if needed
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (e) {
                // Label doesn't exist, create it
                const labelColors = {
                  'needs-investigation': 'fbca04',
                  'feature-request': 'a2eeef',
                  'question': 'd876e3',
                  'security': 'b60205',
                  'needs-more-info': 'fbca04',
                  'very-old-msal': 'ffa500',
                  'triage-issue': 'c5def5',
                  // Priority labels (5-level system based on device count thresholds)
                  'p0-CodeRed': 'd73a4a',   // Red - code red (10000+ devices)
                  'p1-High': 'ff6b6b',      // Orange - high (1000-9999 devices)
                  'p2-Medium': 'fbca04',    // Yellow - medium (300-999 devices)
                  'p3-Low': '0075ca',       // Blue - low (100-299 devices)
                  'p4-Minor': '5DADE2'      // Light blue - minor (<100 devices)
                };
                
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: labelColors[label] || '666666'
                  });
                } catch (createError) {
                  console.log(`Could not create label ${label}: ${createError.message}`);
                }
              }
            }
            
            // Add labels to issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

  # Generate initial response based on issue classification
  respond:
    name: Generate Response
    needs: triage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate Response
        id: generate_response
        uses: actions/github-script@v7
        env:
          ISSUE_TYPE: ${{ needs.triage.outputs.issue_type }}
          NEEDS_INFO: ${{ needs.triage.outputs.needs_info }}
          MSAL_VERSION: ${{ needs.triage.outputs.msal_version }}
          VERSION_AGE_DAYS: ${{ needs.triage.outputs.version_age_days }}
          IS_VERY_OLD: ${{ needs.triage.outputs.is_very_old }}
          VERSION_RELEASE_DATE: ${{ needs.triage.outputs.version_release_date }}
          CLASSIFICATION_REASONS: ${{ needs.triage.outputs.classification_reasons }}
          DETECTED_PATTERNS: ${{ needs.triage.outputs.detected_patterns }}
          HAS_INITIAL_IMPACT: ${{ needs.triage.outputs.has_initial_impact }}
          INITIAL_PRIORITY: ${{ needs.triage.outputs.initial_priority }}
          INITIAL_IMPACT_REASON: ${{ needs.triage.outputs.initial_impact_reason }}
        with:
          script: |
            const fs = require('fs');
            const issueType = process.env.ISSUE_TYPE;
            const needsInfo = process.env.NEEDS_INFO === 'true';
            const msalVersion = process.env.MSAL_VERSION;
            const versionAgeDays = process.env.VERSION_AGE_DAYS;
            const isVeryOld = process.env.IS_VERY_OLD === 'true';
            const versionReleaseDate = process.env.VERSION_RELEASE_DATE;
            const hasInitialImpact = process.env.HAS_INITIAL_IMPACT === 'true';
            const initialPriority = process.env.INITIAL_PRIORITY;
            const initialImpactReason = process.env.INITIAL_IMPACT_REASON;
            const issue = context.payload.issue;
            
            // Parse classification reasons and detected patterns
            let classificationReasons = [];
            let detectedPatterns = [];
            
            try {
              if (process.env.CLASSIFICATION_REASONS) {
                classificationReasons = JSON.parse(process.env.CLASSIFICATION_REASONS);
              }
            } catch (e) {
              console.log('Could not parse classification reasons:', e.message);
            }
            
            try {
              if (process.env.DETECTED_PATTERNS) {
                detectedPatterns = JSON.parse(process.env.DETECTED_PATTERNS);
              }
            } catch (e) {
              console.log('Could not parse detected patterns:', e.message);
            }
            
            // Fetch latest version dynamically
            let latestVersion = '8.+'; // Fallback
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestVersion = latestRelease.data.tag_name.replace(/^v/, '');
            } catch (error) {
              console.log('Could not fetch latest version, using fallback');
            }
            
            let response = '';
            let labelExplanations = [];
            
            // Base acknowledgment
            response = `Thank you for opening this issue! We appreciate you taking the time to help improve MSAL Android.\n\n`;
            
            // Handle very old version FIRST if detected
            if (isVeryOld && msalVersion) {
              response += `⚠️ **Unsupported MSAL Version Detected**\n\n`;
              response += `I've applied the \`very-old-msal\` label because version **${msalVersion}** (released ${versionReleaseDate}) is more than 1.5 years old and is no longer supported.\n\n`;
              response += `**Microsoft MSAL Android supports versions released within the last 1.5 years.**\n\n`;
              response += `**Required Action - Please Upgrade:**\n`;
              response += `1. Update to the latest version (currently **${latestVersion}**) - see [releases](https://github.com/AzureAD/microsoft-authentication-library-for-android/releases)\n`;
              response += `2. Review the [migration guide](https://github.com/AzureAD/microsoft-authentication-library-for-android#migration) for breaking changes\n`;
              response += `3. Test your app with the new version\n`;
              response += `4. If the issue persists with the latest version, please reopen with updated details\n\n`;
              response += `**To upgrade, update your build.gradle:**\n`;
              response += `\`\`\`gradle\n`;
              response += `implementation "com.microsoft.identity.client:msal:8.+"\n`;
              response += `\`\`\`\n`;
              response += `We recommend using \`8.+\` for automatic patch updates within the 8.x series.\n\n`;
              
              labelExplanations.push(`\`very-old-msal\`: Version ${msalVersion} (released ${versionReleaseDate}) is ${versionAgeDays} days old, exceeding the 1.5 year support window (548 days)`);
            }
            
            // Add label explanations based on classification with verbose reasoning
            if (issueType === 'needs-investigation') {
              let investigationExplanation = `\`needs-investigation\`: Requires investigation to determine if this is a bug in MSAL or a configuration/usage issue`;
              if (classificationReasons.length > 0) {
                investigationExplanation += `\n  - ${classificationReasons.join('\n  - ')}`;
              }
              labelExplanations.push(investigationExplanation);
              labelExplanations.push(`**Note:** The team will review this to determine the actual cause and appropriate priority based on customer impact`);
            } else if (issueType === 'feature-request') {
              let featureExplanation = `\`feature-request\`: Classified as a feature request`;
              if (classificationReasons.length > 0) {
                featureExplanation += ` because: ${classificationReasons.join('; ')}`;
              }
              labelExplanations.push(featureExplanation);
            } else if (issueType === 'question') {
              labelExplanations.push(`\`question\`: Classified as a question - seeking clarification or guidance on MSAL usage`);
            } else if (issueType === 'security') {
              let securityExplanation = `\`security\`: Flagged as a potential security concern`;
              if (classificationReasons.length > 0) {
                securityExplanation += ` because: ${classificationReasons.join('; ')}`;
              }
              labelExplanations.push(securityExplanation);
              labelExplanations.push(`**Note:** Security issues require immediate team review`);
            }
            
            // Acknowledge priority if already assigned from initial issue
            if (hasInitialImpact && initialPriority) {
              labelExplanations.push(`\`${initialPriority}\`: Auto-assigned based on customer impact - ${initialImpactReason}`);
            } else {
              // Note about priority if not yet assigned
              labelExplanations.push(`**Priority:** Will be auto-assigned by this workflow when customer impact is provided via PING-COPILOT (based on device counts or explicit priority mentions). Human developers may update the priority label later as needed.`);
            }
            
            if (needsInfo) {
              labelExplanations.push(`\`needs-more-info\`: Additional information is required to properly diagnose and address this issue`);
            }
            
            // Add label explanations section if any
            if (labelExplanations.length > 0) {
              response += `**Labels Applied:**\n`;
              for (const explanation of labelExplanations) {
                response += `- ${explanation}\n`;
              }
              response += `\n`;
            }
            
            // Add AI-generated solution if available
            const aiSolution = '${{ needs.triage.outputs.ai_solution }}';
            const aiConfidence = '${{ needs.triage.outputs.ai_confidence }}';
            if (aiSolution && aiSolution !== '' && !isVeryOld) {
              response += `## 🤖 AI-Generated Solution Suggestion\n\n`;
              response += `${aiSolution}\n\n`;
              if (aiConfidence === 'medium' || aiConfidence === 'low') {
                response += `> **Note:** This is an AI-generated suggestion. Please verify against our documentation.\n\n`;
              }
              response += `---\n\n`;
            }
            
            // Add detected patterns section with solutions
            if (detectedPatterns.length > 0 && !isVeryOld) {
              response += `## 💡 Potential Solutions Detected\n\n`;
              response += `Based on your issue description, I've identified some patterns that might help:\n\n`;
              
              for (const pattern of detectedPatterns) {
                response += `### ${pattern.title}\n\n`;
                response += `${pattern.message}\n\n`;
              }
              
              response += `---\n\n`;
            }
            
            // Only provide detailed guidance if NOT very old version
            if (!isVeryOld) {
              // Handle security issues differently
              if (issueType === 'security') {
                response += `⚠️ **Security Notice**\n\n`;
                response += `For security issues, please report them through our [security reporting process](https://github.com/AzureAD/microsoft-authentication-library-for-android#security-reporting) rather than public GitHub issues.\n\n`;
                response += `This helps protect all users while we investigate and address the concern. Our security team will respond promptly through the proper channels.\n\n`;
                response += `If this is not a security vulnerability but a general question about security features, please clarify and we'll be happy to help!\n`;
              }
              // Issues needing investigation
              else if (issueType === 'needs-investigation') {
                response += `**Important:** Before we investigate further, please verify:\n\n`;
                response += `1. **Check your implementation** against our documentation:\n`;
                response += `   - [MSAL Android Documentation](https://github.com/AzureAD/microsoft-authentication-library-for-android)\n`;
                response += `   - [Code Snippets](snippets/) - Correct API usage patterns\n`;
                response += `   - [Configuration Guide](auth_config.template.json)\n`;
                response += `   - [Golden Examples](examples/) - Complete working applications\n\n`;
                response += `2. **Common causes of errors:**\n`;
                response += `   - Incorrect configuration in \`auth_config.json\` or \`AndroidManifest.xml\`\n`;
                response += `   - Using deprecated APIs (check [Code Snippets](snippets/) for current patterns)\n`;
                response += `   - Mismatched redirect URIs or signature hashes\n`;
                response += `   - Missing required permissions or app registration settings\n\n`;
                
                if (needsInfo) {
                  response += `**To help us investigate, please provide:**\n\n`;
                  response += `**Required Information:**\n`;
                  response += `- [ ] MSAL version (e.g., 8.+, currently ${latestVersion})\n`;
                  response += `- [ ] Android version and device model\n`;
                  response += `- [ ] Account mode (Single or Multiple)\n`;
                  response += `- [ ] Complete error message or stack trace\n`;
                  response += `- [ ] Steps to reproduce the issue\n`;
                  response += `- [ ] Confirmation that you've reviewed the documentation and examples\n\n`;
                  response += `**Optional but Helpful:**\n`;
                  response += `- [ ] Your \`auth_config.json\` (with \`client_id\` redacted)\n`;
                  response += `- [ ] Relevant code snippets showing your implementation\n`;
                  response += `- [ ] Verbose logs (see below)\n\n`;
                  response += `<details>\n<summary>How to enable verbose logging</summary>\n\n`;
                  response += `\`\`\`java\n`;
                  response += `Logger.getInstance().setLogLevel(Logger.LogLevel.VERBOSE);\n`;
                  response += `Logger.getInstance().setEnableLogcatLog(true);\n`;
                  response += `\`\`\`\n</details>\n\n`;
                }
                
                response += `Our team will review this to determine if it's a bug in MSAL or a configuration/usage issue.\n\n`;
              }
              // Feature requests
              else if (issueType === 'feature-request') {
                response += `We've added this to our backlog for review. Feature requests help us prioritize improvements!\n\n`;
                response += `A few questions that might help us understand your needs better:\n`;
                response += `- What problem are you trying to solve?\n`;
                response += `- Are there any workarounds you're currently using?\n`;
                response += `- How critical is this for your application?\n\n`;
              }
              // Questions
              else {
                response += `I'll do my best to help! While we look into this, here are some resources that might be useful:\n\n`;
                response += `- [MSAL Android Documentation](https://github.com/AzureAD/microsoft-authentication-library-for-android)\n`;
                response += `- [Code Snippets](snippets/) - Examples for common operations\n`;
                response += `- [Configuration Guide](auth_config.template.json)\n`;
                response += `- [Golden Examples](examples/) - Complete working applications\n\n`;
                
                if (needsInfo) {
                  response += `To better assist you, please provide:\n`;
                  response += `- MSAL version you're using\n`;
                  response += `- What you're trying to accomplish\n`;
                  response += `- Any error messages you're seeing\n\n`;
                }
              }
            }
            
            // Standard footer with PING-COPILOT trigger
            response += `---\n\n`;
            
            // Prompt for customer impact data if not already detected and not a simple question
            if ((issueType === 'needs-investigation' || issueType === 'feature-request') && !hasInitialImpact) {
              response += `### 📊 Help Us Prioritize\n\n`;
              response += `To help the team prioritize this issue, please provide information about customer impact:\n\n`;
              response += `\`\`\`\n`;
              response += `PING-COPILOT: We have <number> devices/users affected by this issue\n`;
              response += `\`\`\`\n\n`;
              response += `The AI will analyze your impact information and apply the appropriate priority label based on device count thresholds.\n\n`;
              response += `---\n\n`;
            }
            
            response += `**Need further assistance?** You can trigger a follow-up analysis by commenting:\n`;
            response += `\`\`\`\n`;
            response += `PING-COPILOT: <your question or request>\n`;
            response += `\`\`\`\n\n`;
            response += `> **Privacy Note:** PING-COPILOT responses are generated using AI. Your comment will be processed by a language model. Do not include PII (personally identifiable information), credentials, tokens, or other sensitive data in your PING-COPILOT request.\n\n`;
            response += `The Copilot agent will analyze your comment and provide updated guidance based on the full issue context.\n\n`;
            response += `---\n`;
            response += `*This is an automated response. A team member will review your issue soon.*\n`;
            
            core.setOutput('response', response);
            
      - name: Post Comment
        uses: actions/github-script@v7
        env:
          RESPONSE_CONTENT: ${{ steps.generate_response.outputs.response }}
        with:
          script: |
            const response = process.env.RESPONSE_CONTENT;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: response
            });

  # Handle PING-COPILOT follow-up comments
  handle_ping_copilot:
    name: Handle PING-COPILOT Follow-up
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' && 
      github.event.action == 'created' &&
      (contains(github.event.comment.body, 'PING-COPILOT:') || contains(github.event.comment.body, 'ping-copilot:'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Extract PING-COPILOT Request
        id: extract_request
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            
            // Extract the text after PING-COPILOT: (supports multi-line)
            const match = comment.match(/PING-COPILOT:\s*([\s\S]+)/i);
            if (match && match[1]) {
              const userRequest = match[1].trim();
              core.setOutput('user_request', userRequest);
              core.setOutput('has_request', 'true');
              console.log(`PING-COPILOT request detected: ${userRequest}`);
            } else {
              core.setOutput('has_request', 'false');
            }
            
      - name: Detect Customer Impact with AI
        if: steps.extract_request.outputs.has_request == 'true'
        id: detect_impact
        uses: actions/github-script@v7
        env:
          USER_REQUEST: ${{ steps.extract_request.outputs.user_request }}
        with:
          script: |
            const userRequest = process.env.USER_REQUEST;
            const issue = context.payload.issue;
            
            // Use AI to detect customer impact from the user's request
            // Focus on device count as primary indicator, as per guidelines
            let priorityLevel = null;
            let impactReason = '';
            let deviceCount = null;
            
            try {
              // Construct AI prompt to extract impact information
              const impactPrompt = "Analyze the following text and extract customer impact information. " +
                "Focus on finding the NUMBER of devices or users affected. " +
                "Respond with ONLY a JSON object in this format: " +
                '{"deviceCount": <number or null>, "hasExplicitPriority": <boolean>, "explicitPriority": "<p0|p1|null>"}. ' +
                "Examples:\n" +
                '- "We have 500 devices affected" → {"deviceCount": 500, "hasExplicitPriority": false, "explicitPriority": null}\n' +
                '- "This is a p0 issue" → {"deviceCount": null, "hasExplicitPriority": true, "explicitPriority": "p0"}\n' +
                '- "Critical question about config" → {"deviceCount": null, "hasExplicitPriority": false, "explicitPriority": null}\n' +
                "Text to analyze: " + userRequest;
              
              const response = await github.request('POST /models/chat/completions', {
                model: 'gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content: 'You are a data extraction assistant. Extract impact information and respond with only valid JSON. No explanations, just JSON.'
                  },
                  {
                    role: 'user',
                    content: impactPrompt
                  }
                ],
                temperature: 0.1,
                max_tokens: 200
              });
              
              const aiResult = response.data.choices[0].message.content.trim();
              console.log('AI impact detection result:', aiResult);
              
              // Parse AI response
              const extracted = JSON.parse(aiResult);
              deviceCount = extracted.deviceCount;
              
              // Apply priority based on device count (primary method)
              if (deviceCount !== null && deviceCount > 0) {
                if (deviceCount >= 10000) {
                  priorityLevel = 'p0-CodeRed';
                  impactReason = `${deviceCount} devices/users affected`;
                } else if (deviceCount >= 1000) {
                  priorityLevel = 'p1-High';
                  impactReason = `${deviceCount} devices/users affected`;
                } else if (deviceCount >= 300) {
                  priorityLevel = 'p2-Medium';
                  impactReason = `${deviceCount} devices/users affected`;
                } else if (deviceCount >= 100) {
                  priorityLevel = 'p3-Low';
                  impactReason = `${deviceCount} devices/users affected`;
                } else {
                  priorityLevel = 'p4-Minor';
                  impactReason = `${deviceCount} devices/users affected`;
                }
              }
              
              // Check for explicit priority mentions (secondary method)
              if (extracted.hasExplicitPriority && extracted.explicitPriority) {
                const explicitPri = extracted.explicitPriority.toLowerCase();
                if (explicitPri === 'p0' || explicitPri === 'codered') {
                  priorityLevel = 'p0-CodeRed';
                  if (!impactReason) impactReason = 'Customer explicitly requested priority p0/CodeRed';
                } else if (explicitPri === 'p1') {
                  if (!priorityLevel || priorityLevel === 'p2-Medium' || priorityLevel === 'p3-Low' || priorityLevel === 'p4-Minor') {
                    priorityLevel = 'p1-High';
                    if (!impactReason) impactReason = 'Customer explicitly requested priority p1/High';
                  }
                }
              }
              
            } catch (error) {
              console.log('AI impact detection failed, using fallback regex:', error.message);
              
              // Fallback to simple regex if AI fails
              const deviceMatch = userRequest.match(/(\d+)\s*(device|user|customer|install|affected|impacted)/i);
              if (deviceMatch) {
                const count = parseInt(deviceMatch[1], 10);
                deviceCount = count;
                
                if (count >= 10000) {
                  priorityLevel = 'p0-CodeRed';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count >= 1000) {
                  priorityLevel = 'p1-High';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count >= 300) {
                  priorityLevel = 'p2-Medium';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count >= 100) {
                  priorityLevel = 'p3-Low';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                } else if (count > 0) {
                  priorityLevel = 'p4-Minor';
                  impactReason = `${count} ${deviceMatch[2]}s affected`;
                }
              }
              
              // Check for explicit priority mentions
              if (requestLower.includes('p0') || requestLower.includes('codered')) {
                priorityLevel = 'p0-CodeRed';
                if (!impactReason) impactReason = 'Customer explicitly requested priority p0/CodeRed';
              }
              
              if (!priorityLevel && (requestLower.includes('p1') || requestLower.includes('high priority'))) {
                priorityLevel = 'p1-High';
                if (!impactReason) impactReason = 'High priority issue reported';
              }
            }
            
            core.setOutput('has_impact', priorityLevel ? 'true' : 'false');
            core.setOutput('priority_level', priorityLevel || '');
            core.setOutput('impact_reason', impactReason);
            core.setOutput('device_count', deviceCount !== null ? deviceCount.toString() : '');
            
            if (priorityLevel) {
              console.log(`Customer impact detected: ${priorityLevel} - ${impactReason}`);
            }
      
      - name: Apply Priority Label
        if: steps.detect_impact.outputs.has_impact == 'true'
        uses: actions/github-script@v7
        env:
          PRIORITY_LEVEL: ${{ steps.detect_impact.outputs.priority_level }}
        with:
          script: |
            const priorityLevel = process.env.PRIORITY_LEVEL;
            
            // Create the label if it doesn't exist
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: priorityLevel
              });
            } catch (e) {
              // Label doesn't exist, create it
              // Priority label colors based on new 5-level system:
              // p0-CodeRed=Red (critical), p1-High=Orange (high), p2-Medium=Yellow (medium)
              // p3-Low=Blue (low), p4-Minor=Light blue (minor)
              const labelColors = {
                'p0-CodeRed': 'd73a4a',  // Red - critical (10000+ devices)
                'p1-High': 'ff6b6b',     // Orange - high (1000-9999 devices)
                'p2-Medium': 'fbca04',   // Yellow - medium (300-999 devices)
                'p3-Low': '0075ca',      // Blue - low (100-299 devices)
                'p4-Minor': '5DADE2'     // Light blue - minor (<100 devices)
              };
              
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: priorityLevel,
                  color: labelColors[priorityLevel] || 'fbca04',  // Fallback shouldn't be reached with current logic
                  description: `Priority ${priorityLevel} issue`
                });
              } catch (createError) {
                console.log(`Could not create label ${priorityLevel}: ${createError.message}`);
              }
            }
            
            // Add the priority label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [priorityLevel]
            });
      
      - name: Fetch Guidance Files
        if: steps.extract_request.outputs.has_request == 'true'
        id: fetch_guidance
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read guidance files from the repository
            let copilotInstructions = '';
            let commonIssuesGuide = '';
            
            try {
              copilotInstructions = fs.readFileSync('.github/copilot-instructions.md', 'utf8');
              console.log('Loaded copilot-instructions.md');
            } catch (e) {
              console.log('Could not load copilot-instructions.md:', e.message);
            }
            
            try {
              commonIssuesGuide = fs.readFileSync('.github/issue-responses/common-issues-guide.md', 'utf8');
              console.log('Loaded common-issues-guide.md');
            } catch (e) {
              console.log('Could not load common-issues-guide.md:', e.message);
            }
            
            // Truncate if too long (GitHub Models has token limits)
            const maxLength = 15000;
            if (copilotInstructions.length > maxLength) {
              copilotInstructions = copilotInstructions.substring(0, maxLength) + '\n\n[... truncated for length ...]';
            }
            if (commonIssuesGuide.length > maxLength) {
              commonIssuesGuide = commonIssuesGuide.substring(0, maxLength) + '\n\n[... truncated for length ...]';
            }
            
            core.setOutput('copilot_instructions', copilotInstructions);
            core.setOutput('common_issues', commonIssuesGuide);
      
      - name: Generate AI-Powered Response
        if: steps.extract_request.outputs.has_request == 'true'
        uses: actions/github-script@v7
        env:
          USER_REQUEST: ${{ steps.extract_request.outputs.user_request }}
          HAS_IMPACT: ${{ steps.detect_impact.outputs.has_impact }}
          PRIORITY_LEVEL: ${{ steps.detect_impact.outputs.priority_level }}
          IMPACT_REASON: ${{ steps.detect_impact.outputs.impact_reason }}
          DEVICE_COUNT: ${{ steps.detect_impact.outputs.device_count }}
          COPILOT_INSTRUCTIONS: ${{ steps.fetch_guidance.outputs.copilot_instructions }}
          COMMON_ISSUES: ${{ steps.fetch_guidance.outputs.common_issues }}
        with:
          script: |
            const userRequest = process.env.USER_REQUEST;
            const hasImpact = process.env.HAS_IMPACT === 'true';
            const priorityLevel = process.env.PRIORITY_LEVEL;
            const impactReason = process.env.IMPACT_REASON;
            const deviceCount = process.env.DEVICE_COUNT;
            const copilotInstructions = process.env.COPILOT_INSTRUCTIONS;
            const commonIssues = process.env.COMMON_ISSUES;
            const issue = context.payload.issue;
            
            // Fetch latest version
            let latestVersion = '8.+';
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              latestVersion = latestRelease.data.tag_name.replace(/^v/, '');
            } catch (error) {
              console.log('Could not fetch latest version');
            }
            
            // Build comprehensive context for AI
            const issueTitle = issue.title || '';
            let issueBody = issue.body || '';
            let sanitizedUserRequest = userRequest;
            
            // Redact potential secrets and PII before sending to AI
            function redactSecrets(text) {
              if (!text) return text;
              
              // Redact common secret patterns
              let redacted = text;
              
              // JWT tokens (three base64 segments separated by dots)
              redacted = redacted.replace(/\beyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g, '[REDACTED_JWT]');
              
              // Bearer tokens
              redacted = redacted.replace(/Bearer\s+[A-Za-z0-9_-]+/gi, 'Bearer [REDACTED_TOKEN]');
              
              // Authorization headers
              redacted = redacted.replace(/Authorization:\s*[^\n]+/gi, 'Authorization: [REDACTED]');
              
              // client_secret values
              redacted = redacted.replace(/"client_secret"\s*:\s*"[^"]+"/gi, '"client_secret": "[REDACTED]"');
              redacted = redacted.replace(/client_secret\s*[=:]\s*[^\s,}]+/gi, 'client_secret=[REDACTED]');
              
              // Access tokens in URLs or JSON
              redacted = redacted.replace(/access_token[=:]\s*[A-Za-z0-9_-]+/gi, 'access_token=[REDACTED]');
              
              // API keys
              redacted = redacted.replace(/api[_-]?key\s*[=:]\s*[^\s,}]+/gi, 'api_key=[REDACTED]');
              
              // Long base64 strings that might be secrets (40+ chars)
              redacted = redacted.replace(/\b[A-Za-z0-9+/]{40,}={0,2}\b/g, '[REDACTED_BASE64]');
              
              return redacted;
            }
            
            issueBody = redactSecrets(issueBody);
            sanitizedUserRequest = redactSecrets(sanitizedUserRequest);
            
            // Construct prompt for GitHub Models with security instruction
            const systemPrompt = "You are an expert on MSAL (Microsoft Authentication Library) for Android. You help developers troubleshoot authentication issues and provide guidance based on official documentation.\n\n" +
              "IMPORTANT SECURITY INSTRUCTION: Never echo or include any secrets, tokens, API keys, or credentials in your response. If you see redacted values like [REDACTED_JWT] or [REDACTED_TOKEN], do not reference them.\n\n" +
              "You have access to the following comprehensive guides:\n\n" +
              "## COPILOT INSTRUCTIONS:\n" + copilotInstructions + "\n\n" +
              "## COMMON ISSUES GUIDE:\n" + commonIssues + "\n\n" +
              "Your task is to analyze the user's question and provide a helpful, specific response based on these guides. Be concise but thorough. Include relevant code examples, configuration snippets, and links to documentation when appropriate.";

            const userPrompt = "Issue Context:\n" +
              "Title: " + issueTitle + "\n" +
              "Description: " + issueBody + "\n\n" +
              "User Question: " + sanitizedUserRequest + "\n\n" +
              (deviceCount ? "Customer Impact: " + deviceCount + " devices/users affected\n\n" : "") +
              "MSAL Latest Version: " + latestVersion + "\n\n" +
              "Please provide a detailed, helpful response to the user's question based on the guidance documents. Focus on practical solutions and include relevant examples.";

            let aiResponse = '';
            
            // Try to call GitHub Models API
            try {
              console.log('Attempting to call GitHub Models API...');
              
              // GitHub Models API endpoint (uses GitHub token)
              const response = await github.request('POST /models/chat/completions', {
                model: 'gpt-4o',
                messages: [
                  {
                    role: 'system',
                    content: systemPrompt
                  },
                  {
                    role: 'user',
                    content: userPrompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 2000
              });
              
              aiResponse = response.data.choices[0].message.content;
              console.log('Successfully generated AI response');
              
            } catch (error) {
              console.log('GitHub Models API not available or failed:', error.message);
              
              // Fallback to comprehensive documentation response
              aiResponse = `I'll help analyze your request: "${userRequest}"\n\n`;
              aiResponse += `### Available Resources\n\n`;
              aiResponse += `To help address your question, please review these comprehensive guides:\n\n`;
              aiResponse += `**Primary Documentation:**\n`;
              aiResponse += `- **[Copilot Instructions](https://github.com/AzureAD/microsoft-authentication-library-for-android/blob/dev/.github/copilot-instructions.md)** - Complete MSAL Android guidance\n`;
              aiResponse += `- **[Common Issues Guide](https://github.com/AzureAD/microsoft-authentication-library-for-android/blob/dev/.github/issue-responses/common-issues-guide.md)** - Comprehensive troubleshooting\n`;
              aiResponse += `- **[auth_config.template.json](https://github.com/AzureAD/microsoft-authentication-library-for-android/blob/dev/auth_config.template.json)** - Configuration reference\n`;
              aiResponse += `- **[Code Snippets](https://github.com/AzureAD/microsoft-authentication-library-for-android/tree/dev/snippets)** - API usage examples\n`;
              aiResponse += `- **[Golden Examples](https://github.com/AzureAD/microsoft-authentication-library-for-android/tree/dev/examples)** - Working applications\n\n`;
              aiResponse += `**Latest Version:** ${latestVersion} ([releases](https://github.com/AzureAD/microsoft-authentication-library-for-android/releases))\n\n`;
              aiResponse += `> **Note:** GitHub Models AI is not currently available. This issue will be reviewed by the maintainers.`;
            }
            
            // Build final response
            let response = '';
            
            // If customer impact was detected, acknowledge it first
            if (hasImpact) {
              response += `📊 **Customer Impact Detected**\n\n`;
              response += `Thank you for providing impact information. I've applied the \`${priorityLevel}\` priority label based on: ${impactReason}\n\n`;
              response += `The team will review and prioritize this issue accordingly.\n\n`;
              response += `---\n\n`;
            }
            
            // Add AI response
            response += aiResponse;
            
            // Footer
            response += `\n\n---\n\n`;
            response += `**Need more help?** You can trigger another follow-up by commenting:\n`;
            response += `\`\`\`\n`;
            response += `PING-COPILOT: <your question>\n`;
            response += `\`\`\`\n\n`;
            response += `> **Privacy Note:** PING-COPILOT responses are generated using AI. Your comment will be processed by a language model. Do not include PII (personally identifiable information), credentials, tokens, or other sensitive data in your PING-COPILOT request.\n\n`;
            response += `---\n`;
            response += `*AI-powered response using GitHub Models. A team member will review the conversation.*\n`;
            
            // Post the response
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: response
            });
